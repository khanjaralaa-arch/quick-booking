<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجوزات سريعة — Quick Booking</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2333;--mute:#6b7385;--line:#e3e6ee;--pri:#2f6bff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c2e;--ink:#e8eaf2;--mute:#9aa1b5;--line:#2a2f45}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
h1{font-size:19px;margin:0}main{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;font:inherit}
textarea{min-height:60px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:8px 12px;font:inherit}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}button.sm{padding:4px 8px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tools>input,.tools>select{flex:1;min-width:130px}
.item{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.time{font-weight:700;font-variant-numeric:tabular-nums}.time small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.name{font-weight:600}.meta{font-size:13px;color:var(--mute)}.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;margin-inline-start:6px}
.s-confirmed{background:var(--pri)}.s-done{background:var(--ok)}.s-cancelled{background:var(--bad)}.s-pending{background:var(--warn)}
.cancelled .name{text-decoration:line-through;opacity:.6}.empty{text-align:center;color:var(--mute);padding:30px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}a{color:var(--pri)}
</style>
</head>
<body>
<header>
  <h1>📅 حجوزات سريعة</h1>
  <div class="row" style="flex:0">
    <button onclick="exportData()">⬇️ تصدير</button>
    <button onclick="imp.click()">⬆️ استيراد</button>
    <input id="imp" type="file" accept=".json" hidden onchange="importData(this.files[0])">
  </div>
</header>
<main>
  <form class="card" id="f" onsubmit="save(event)">
    <h3 style="margin:0 0 6px" id="ftitle">حجز جديد</h3>
    <input type="hidden" id="id">
    <label>اسم العميل *</label><input id="name" required>
    <label>رقم الهاتف</label><input id="phone" type="tel" dir="ltr">
    <label>الخدمة</label><input id="service" list="services">
    <datalist id="services"></datalist>
    <div class="row">
      <div><label>التاريخ *</label><input id="date" type="date" required></div>
      <div><label>الوقت *</label><input id="time" type="time" required></div>
    </div>
    <div class="row">
      <div><label>المدة (دقيقة)</label><input id="dur" type="number" min="5" step="5" value="30"></div>
      <div><label>الحالة</label><select id="status">
        <option value="confirmed">مؤكد</option><option value="pending">بانتظار</option>
        <option value="done">تم</option><option value="cancelled">ملغي</option></select></div>
    </div>
    <label>ملاحظات</label><textarea id="notes"></textarea>
    <div class="err" id="err"></div>
    <div class="row"><button class="pri" type="submit">💾 حفظ</button><button type="button" onclick="resetForm()">جديد</button></div>
  </form>
  <section>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input id="q" placeholder="🔍 بحث بالاسم أو الهاتف أو الخدمة" oninput="render()">
      <input id="fd" type="date" oninput="render()">
      <select id="fs" onchange="render()"><option value="">كل الحالات</option><option value="confirmed">مؤكد</option><option value="pending">بانتظار</option><option value="done">تم</option><option value="cancelled">ملغي</option></select>
      <button onclick="fd.value=today();render()">اليوم</button><button onclick="fd.value='';render()">الكل</button>
    </div>
    <div class="card" style="padding:0" id="list"></div>
  </section>
</main>
<script>
const KEY='quick-booking-v1', ST={confirmed:'مؤكد',pending:'بانتظار',done:'تم',cancelled:'ملغي'};
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id), today=()=>new Date().toLocaleDateString('en-CA');
const persist=()=>localStorage.setItem(KEY,JSON.stringify(data));
const mins=t=>{const[h,m]=t.split(':');return +h*60+ +m};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function conflict(b){return data.find(x=>x.id!==b.id&&x.date===b.date&&x.status!=='cancelled'&&b.status!=='cancelled'&&
  mins(b.time)<mins(x.time)+(+x.dur||30)&&mins(x.time)<mins(b.time)+(+b.dur||30))}

function save(e){e.preventDefault();
  const b={id:$('id').value||crypto.randomUUID(),name:$('name').value.trim(),phone:$('phone').value.trim(),service:$('service').value.trim(),
    date:$('date').value,time:$('time').value,dur:+$('dur').value||30,status:$('status').value,notes:$('notes').value.trim()};
  const c=conflict(b);
  if(c&&!confirm(`يتعارض مع حجز ${c.name} الساعة ${c.time}. حفظ على أي حال؟`))return;
  const i=data.findIndex(x=>x.id===b.id); i>=0?data[i]=b:data.push(b);
  persist();resetForm();render();
}
function edit(id){const b=data.find(x=>x.id===id);for(const k of['id','name','phone','service','date','time','dur','status','notes'])$(k).value=b[k]??'';
  $('ftitle').textContent='تعديل حجز';$('name').focus();scrollTo({top:0,behavior:'smooth'})}
function setStatus(id,s){data.find(x=>x.id===id).status=s;persist();render()}
function del(id){if(confirm('حذف الحجز نهائياً؟')){data=data.filter(x=>x.id!==id);persist();render()}}
function resetForm(){$('f').reset();$('id').value='';$('date').value=$('fd').value||today();$('dur').value=30;$('ftitle').textContent='حجز جديد';$('err').textContent=''}

function render(){
  const q=$('q').value.trim().toLowerCase(),d=$('fd').value,s=$('fs').value;
  const rows=data.filter(b=>(!d||b.date===d)&&(!s||b.status===s)&&(!q||[b.name,b.phone,b.service,b.notes].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const td=data.filter(b=>b.date===today());
  $('stats').innerHTML=[['حجوزات اليوم',td.filter(b=>b.status!=='cancelled').length],['قادمة',data.filter(b=>b.date>=today()&&['confirmed','pending'].includes(b.status)).length],
    ['تمت',data.filter(b=>b.status==='done').length],['الإجمالي',data.length]].map(([l,n])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('services').innerHTML=[...new Set(data.map(b=>b.service).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join('');
  $('list').innerHTML=rows.length?rows.map(b=>`<div class="item ${b.status}">
    <div class="time">${b.time}<small>${b.date}</small></div>
    <div><span class="name">${esc(b.name)}</span><span class="tag s-${b.status}">${ST[b.status]}</span>
      <div class="meta">${[b.service&&'✂️ '+esc(b.service),b.phone&&`📞 <a href="tel:${esc(b.phone)}" dir="ltr">${esc(b.phone)}</a>`,b.phone&&`<a target="_blank" href="https://wa.me/${b.phone.replace(/\D/g,'')}">واتساب</a>`,b.dur+' د'].filter(Boolean).join(' · ')}</div>
      ${b.notes?`<div class="meta">📝 ${esc(b.notes)}</div>`:''}</div>
    <div class="acts">${b.status!=='done'?`<button class="sm" onclick="setStatus('${b.id}','done')">✔ تم</button>`:''}
      ${b.status!=='cancelled'?`<button class="sm" onclick="setStatus('${b.id}','cancelled')">✖ إلغاء</button>`:''}
      <button class="sm" onclick="edit('${b.id}')">✏️</button><button class="sm" onclick="del('${b.id}')">🗑</button></div></div>`).join('')
    :'<div class="empty">لا توجد حجوزات</div>';
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`bookings-${today()}.json`;a.click()}
function importData(file){if(!file)return;file.text().then(t=>{try{const arr=JSON.parse(t);if(!Array.isArray(arr))throw 0;
  const ids=new Set(data.map(x=>x.id));data=data.concat(arr.filter(x=>x&&x.id&&!ids.has(x.id)));persist();render();alert('تم الاستيراد ✅')}catch{alert('ملف غير صالح')}})}

$('fd').value=today();resetForm();render();
</script>
</body>
</html>
